<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div id="navbar">
        
    </div>

    <div id="addCategoria" class="container mt-4">
        <div class="card" style="background-color: #223146;">
            <div class="card-body">
                <h1 class=" text-white h4 text-center mb-4" >Criar Categoria</h1>
                <form id="formCategoria" enctype="multipart/form-data">
                    <div style="width: 70%;">
                        <div class="mb-3">
                            <input name="titulo" id="Ncategoria" type="text" class="form-control" placeholder="Nova categoria" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2 justify-content-start">
                        <button type="submit" class="btn" style="background-color: #BAC5CE;">Enviar</button>
                        <button onclick="homePage()" class="btn" style="background-color: #D6ADAD;">Cancelar</button>
                    </div>
                </form>
                <p class="text-white" id="msg"></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="baseScr.js"></script>
    <script src="addCategoriaScr.js"></script>
    
</body>
</html>
