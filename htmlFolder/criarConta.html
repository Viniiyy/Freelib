<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Cadastro</title>
    <style>
        .btn-confirmar {
            background-color: #284d81;
            border-color: #284d81;
            color: #fff;
        }
        .btn-confirmar:hover,
        .btn-confirmar:focus,
        .btn-confirmar:active {
            background-color: #1f3d67;
            border-color: #1f3d67;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Barra de cima (voltar do login) -->
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
                &larr; Voltar
            </a>
        </div>
    </nav>

    <!-- Caixa de cadastro no meio -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-sm w-100" style="max-width: 400px;">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4">Criar conta</h1>

                <form id="form-cadastro">
                    <div class="mb-3">
                        <label for="fotoPerfil" class="form-label">Foto de perfil</label>
                        <input type="file" class="form-control" id="fotoPerfil" name="fotoPerfil" accept="image/*" required>
                    </div>

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome completo" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00"
                            inputmode="numeric" maxlength="14" required>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required>
                    </div>

                    <div id="msg" class="alert d-none"></div>
                    <button type="submit" class="btn btn-confirmar w-100">Cadastrar</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="criarContaScr.js"></script>
    <script>
        // Máscara simples para o CPF (000.000.000-00)
        document.getElementById('cpf').addEventListener('input', function () {
            let v = this.value.replace(/\D/g, '').slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            this.value = v;
        });
    </script>
</body>
</html>
